syntax = "proto3";

package grpcwebtest;

service TestService {
  rpc Unary(EchoRequest) returns (EchoReply);
  rpc Stream(StreamRequest) returns (stream EchoReply);
  rpc Fail(FailRequest) returns (EchoReply);
}

message EchoRequest {
  string message = 1;
}

message StreamRequest {
  string message = 1;
  uint32 count = 2;
  uint32 delay_ms = 3;
  bool empty = 4;
  uint32 fail_after = 5;
  int32 fail_code = 6;
  string fail_message = 7;
  uint32 response_payload_bytes = 8;
  bool include_server_timing = 9;
}

message FailRequest {
  int32 code = 1;
  string message = 2;
}

message EchoReply {
  string message = 1;
  uint32 sequence = 2;
  uint64 server_elapsed_ns = 3;
}
