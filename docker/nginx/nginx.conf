load_module modules/ngx_http_grpc_web_module.so;

worker_processes auto;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;

    upstream grpc_backend {
        server backend:50051;
    }

    upstream grpc_fault_backend {
        server fault-backend:50052;
    }

    upstream grpc_dead_backend {
        server 127.0.0.1:59999;
    }

    server {
        listen 8080;

        location / {
            # Test-harness CORS only. CORS is deliberately not implemented by
            # ngx_http_grpc_web_module and is outside the project scope.
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "grpc-status, grpc-message" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "content-type, x-grpc-web, x-user-agent, grpc-timeout, authorization" always;
                add_header Access-Control-Max-Age "600" always;
                return 204;
            }

            grpc_web on;
            grpc_web_max_frame_size 64m;

            # Keep the integration harness intentionally small so large native
            # gRPC frames cross several upstream buffers.
            grpc_buffer_size 1k;
            grpc_read_timeout 1h;
            grpc_send_timeout 1h;

            grpc_pass grpc://grpc_backend;
        }
    }

    # M6: deterministic connect failure. The browser uses the same generated
    # grpc-web method path; only the endpoint/port changes.
    server {
        listen 8082;

        location / {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "grpc-status, grpc-message" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "content-type, x-grpc-web, x-user-agent, grpc-timeout, authorization" always;
                add_header Access-Control-Max-Age "600" always;
                return 204;
            }

            grpc_web on;
            grpc_web_max_frame_size 64m;
            grpc_connect_timeout 100ms;
            grpc_read_timeout 1s;
            grpc_send_timeout 1s;
            grpc_pass grpc://grpc_dead_backend;
        }
    }

    # M6: deterministic proxy-side read timeout before the first DATA frame.
    server {
        listen 8084;

        location / {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "grpc-status, grpc-message" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "content-type, x-grpc-web, x-user-agent, grpc-timeout, authorization" always;
                add_header Access-Control-Max-Age "600" always;
                return 204;
            }

            grpc_web on;
            grpc_web_max_frame_size 64m;
            grpc_connect_timeout 1s;
            grpc_read_timeout 100ms;
            grpc_send_timeout 1s;
            grpc_pass grpc://grpc_backend;
        }
    }

    # M7: raw HTTP/2 transport-fault injection. The fault backend can send
    # RST_STREAM before/after DATA, abruptly reset TCP, or advertise malformed
    # frame lengths. A deliberately small frame limit makes allocation guards
    # observable without large test payloads.
    server {
        listen 8086;

        location / {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "grpc-status, grpc-message" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "content-type, x-grpc-web, x-user-agent, grpc-timeout, authorization, x-fault-mode" always;
                add_header Access-Control-Max-Age "600" always;
                return 204;
            }

            grpc_web on;
            grpc_web_max_frame_size 1k;
            grpc_buffer_size 1k;
            grpc_connect_timeout 1s;
            grpc_read_timeout 2s;
            grpc_send_timeout 2s;
            grpc_set_header X-Fault-Mode $http_x_fault_mode;
            grpc_pass grpc://grpc_fault_backend;
        }
    }
}
