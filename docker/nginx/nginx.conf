load_module modules/ngx_http_grpc_web_module.so;

worker_processes auto;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;

    upstream grpc_backend {
        server backend:50051;
    }

    server {
        listen 8080;

        location / {
            # Test-harness CORS only. CORS is deliberately not implemented by
            # ngx_http_grpc_web_module and is outside the project scope.
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "grpc-status, grpc-message" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "content-type, x-grpc-web, x-user-agent, grpc-timeout, authorization" always;
                add_header Access-Control-Max-Age "600" always;
                return 204;
            }

            grpc_web on;
            grpc_web_max_frame_size 64m;

            grpc_read_timeout 1h;
            grpc_send_timeout 1h;

            grpc_pass grpc://grpc_backend;
        }
    }
}
