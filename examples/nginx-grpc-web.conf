load_module modules/ngx_http_grpc_web_module.so;

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    log_format grpc_gateway
        '$remote_addr $request_id "$request" '
        'status=$status upstream_status=$upstream_status '
        'request_time=$request_time upstream_time=$upstream_response_time '
        'bytes_sent=$bytes_sent';

    access_log /var/log/nginx/grpc-web-access.log grpc_gateway;
    error_log  /var/log/nginx/grpc-web-error.log warn;

    upstream grpc_backend {
        server 10.0.0.10:50051;
        server 10.0.0.11:50051;
    }

    server {
        listen 443 ssl;
        http2 on;

        server_name api.example.internal;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/private.key;

        # Match only the RPC namespace that should use gRPC-Web adaptation.
        location /example.v1.ExampleService/ {
            grpc_web on;
            grpc_web_max_frame_size 64m;

            # Tune these to the longest legitimate server stream.
            grpc_read_timeout 1h;
            grpc_send_timeout 1h;

            # Stock NGINX grpc module owns the upstream HTTP/2 transport.
            grpc_pass grpc://grpc_backend;
        }
    }
}

# Intentionally absent from the module example:
# - CORS
# - authentication
# - routing policy
# - retries/circuit breakers
# - service discovery
# Configure those with normal NGINX/infrastructure facilities outside
# ngx_http_grpc_web_module.
