name: Bootstrap repository

on:
  push:
    branches:
      - agent/bootstrap-grpc-web
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-grpc-web
          fetch-depth: 0

      - name: Reassemble and verify starter archive
        shell: bash
        run: |
          set -euo pipefail
          check_chunk() {
            local file="$1"
            local expected="$2"
            tr -d '\r\n' < "$file" > /tmp/chunk
            printf '%s  %s\n' "$expected" '/tmp/chunk' | sha256sum -c -
          }
          check_chunk .bootstrap/part-00 6ed6c667571c9e0320d9f7dedc0bb007344f806196d411c581809cee1ff03123
          check_chunk .bootstrap/part-01 b5d346b64bdd11796c574869ce78f15ba58769e5fae7ad32be4caba43141f500
          check_chunk .bootstrap/part-02 109e5b763118a256a4618562f1f7da3e0201f0f0f46fbf9e7934c20b4ef1a981
          check_chunk .bootstrap/tail-00 175cabcdad17f39c6fcd79826344a3f3aca5179a2915fc569071eb95d1e024e3
          check_chunk .bootstrap/tail-01 6ee1ec15245957874ffbecab53a19ae5c41c11f2e7ee7b30120cab8b02ddf67b
          check_chunk .bootstrap/tail-02 e36ae07ab85025ab703732b396cb3089ab34f61d140db61f3502da914e892280
          check_chunk .bootstrap/tail-03-0 799b47fad03edd8c2d695392a10561f267e8a890d41a97299963c30f76ae964f
          check_chunk .bootstrap/tail-03-1 d04ef0559ef6bbd4e002ebdc199d69e02ebf34ab633c87235e6fe24f5d12e688
          check_chunk .bootstrap/tail-03-2 b0dc539ab3d79da877ddd2046fb822d38e9ee76a34f22e2f941178fe33e3b07d
          check_chunk .bootstrap/tail-03-3 cd3c87b519d92f5173b5cd985ebcccbb0e6e4341423a0caedf40ee1218fd2f3d
          check_chunk .bootstrap/tail-04-0 f23bff088df167c5608a2ea93f9e55552343628d925f72e5e83f7935ad9e0124
          check_chunk .bootstrap/tail-04-1 f97667fe36a26feb35330f95e0df87f5f168686fd9260788138f7ad1b9caf994
          check_chunk .bootstrap/tail-04-2 9b6e3c724007234f96cba1afb85c8d35780c3265e628cd7f623b542d2d60fe66
          check_chunk .bootstrap/tail-04-3 9ad44a3a0bca8c7d3aee7bee991290faf240374f8e4ff59e64303fe31df50203
          check_chunk .bootstrap/tail-05-0 d8477d9d8ce4094ca0390549efec32b668ef46a02901bdd1eb9fcc2d4b3f2312
          check_chunk .bootstrap/tail-05-1 6db358d956ab515ea2e990618cc51c8f42779c01278401de95d16d40d2437257
          check_chunk .bootstrap/tail-05-2 c0a2835590280538f2a1216379f00eb473ca9632b20c417fc85b5a7cf68a5c0f
          check_chunk .bootstrap/tail-05-3 3f909710e9e66ee9bfe4edba874c2b697bd9f414860ef6cb5c074fdd2f26b6b1
          check_chunk .bootstrap/tail-06 8d52b91d18e92d63230c6735c94a716cfe2d6e073c6b7a36a5e2eea0eed3c474

          cat .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 \
              .bootstrap/tail-00 .bootstrap/tail-01 .bootstrap/tail-02 \
              .bootstrap/tail-03-0 .bootstrap/tail-03-1 .bootstrap/tail-03-2 .bootstrap/tail-03-3 \
              .bootstrap/tail-04-0 .bootstrap/tail-04-1 .bootstrap/tail-04-2 .bootstrap/tail-04-3 \
              .bootstrap/tail-05-0 .bootstrap/tail-05-1 .bootstrap/tail-05-2 .bootstrap/tail-05-3 \
              .bootstrap/tail-06 | tr -d '\r\n' > /tmp/starter.b64
          test "$(wc -c < /tmp/starter.b64)" -eq 36036
          printf '%s  %s\n' '34949202addff586d87cb3efc5bad595e5c7a12af7d97c82f11ceda7763a18de' '/tmp/starter.b64' | sha256sum -c -
          base64 --decode /tmp/starter.b64 > /tmp/starter.tar.gz
          printf '%s  %s\n' '4c86ae470ac5e06f76fceaf27d7470f3182c51537f972a6b6f714e070d4d64c9' '/tmp/starter.tar.gz' | sha256sum -c -
          tar -tzf /tmp/starter.tar.gz >/dev/null

      - name: Expand project tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/starter
          mkdir -p /tmp/starter
          tar -xzf /tmp/starter.tar.gz -C /tmp/starter
          test -f /tmp/starter/nginx-grpc-web/AGENTS.md
          test -f /tmp/starter/nginx-grpc-web/.github/workflows/ci.yml
          cp -a /tmp/starter/nginx-grpc-web/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit expanded repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'bootstrap grpc-web module'
          git push origin HEAD:agent/bootstrap-grpc-web
