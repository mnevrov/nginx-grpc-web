name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/protocol/requirements.txt
      - run: make unit
      - run: make perf-capacity-test

  perf-loadgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
      - working-directory: perf/loadgen
        run: go test ./...

  perf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NGINX_VERSION: "1.30.4"
      BUILD_CC: gcc
      PERF_OUTPUT_DIR: /tmp/perf-smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
      - run: make perf-smoke
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-smoke-results
          path: /tmp/perf-smoke/
          if-no-files-found: warn
          retention-days: 3

  perf-h2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NGINX_VERSION: "1.30.4"
      BUILD_CC: gcc
      PERF_OUTPUT_DIR: /tmp/perf-h2-smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
      - run: make perf-h2-smoke
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/perf-h2-smoke')
          raw = [p for p in root.glob('*.json') if p.name != 'report.json']
          assert raw, 'no raw TLS/H2 benchmark results'
          for path in raw:
              data = json.loads(path.read_text())
              assert data['config']['frontend'] == 'tls-h2', path
              assert data['config']['require_http2'] is True, path
              assert data['summary']['errors'] == 0, path
              for stream in data['streams']:
                  assert stream['http_protocol'] == 'HTTP/2.0', (path, stream)
                  assert stream['tls_alpn'] == 'h2', (path, stream)
                  assert stream['tls_version'] in {'TLS1.2', 'TLS1.3'}, (path, stream)
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-h2-smoke-results
          path: /tmp/perf-h2-smoke/
          if-no-files-found: warn
          retention-days: 3

  perf-capacity-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        frontend: ["http1", "tls-h2"]
    env:
      NGINX_VERSION: "1.30.4"
      BUILD_CC: gcc
      PERF_FRONTEND: ${{ matrix.frontend }}
      PERF_OUTPUT_DIR: /tmp/perf-capacity-${{ matrix.frontend }}
      PERF_CAPACITY_SLO: perf/scenarios/capacity-smoke-slo.json
      PERF_CAPACITY_STEPS: "1,2"
      PERF_CAPACITY_MESSAGES: "2"
      PERF_CAPACITY_DELAY_MS: "5"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
      - run: bash ./perf/run-ab.sh capacity
      - run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          frontend = os.environ['PERF_FRONTEND']
          root = Path(os.environ['PERF_OUTPUT_DIR'])
          result = json.loads((root / 'capacity.json').read_text())
          assert result['scenario']['frontend'] == frontend
          assert result['scenario']['transport'] == 'text'
          for arch in ('legacy', 'native'):
              points = result['architectures'][arch]['points']
              assert [p['streams'] for p in points] == [1, 2], (arch, points)
              assert all(p['pass'] for p in points), (arch, points)
              assert result['architectures'][arch]['max_sustainable_streams'] == 2
              assert result['architectures'][arch]['first_failed_streams'] is None
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-capacity-${{ matrix.frontend }}-results
          path: /tmp/perf-capacity-${{ matrix.frontend }}/
          if-no-files-found: warn
          retention-days: 3

  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make sanitizers CC=clang
      - run: make fuzz-smoke FUZZ_CC=clang

  build-module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nginx: ["1.30.4", "1.31.3"]
        compiler: ["gcc", "clang"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: >-
          docker build
          --build-arg NGINX_VERSION=${{ matrix.nginx }}
          --build-arg BUILD_CC=${{ matrix.compiler }}
          -f docker/nginx/Dockerfile .

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make package-module NGINX_VERSION=1.30.4 BUILD_CC=gcc
      - run: |
          set -euo pipefail
          package_dir="dist/nginx-1.30.4-gcc-linux-$(uname -m)"
          test -f "$package_dir/ngx_http_grpc_web_module.so"
          test -f "$package_dir/MANIFEST.txt"
          sha256sum -c "$package_dir/SHA256SUMS"
          grep -Fx 'nginx_version=1.30.4' "$package_dir/MANIFEST.txt"
          grep -Fx 'compiler=gcc' "$package_dir/MANIFEST.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ngx-http-grpc-web-nginx-1.30.4-gcc-linux-amd64
          path: dist/nginx-1.30.4-gcc-linux-x86_64/
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nginx: ["1.30.4", "1.31.3"]
    env:
      NGINX_VERSION: ${{ matrix.nginx }}
      BUILD_CC: gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/protocol/requirements.txt
      - run: docker compose up -d --build backend envoy nginx
      - run: |
          set -euo pipefail
          for url in http://127.0.0.1:18081/ http://127.0.0.1:18080/; do
            ready=0
            for i in $(seq 1 45); do
              if curl -sS -o /dev/null "$url" 2>/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            test "$ready" -eq 1
          done
      - run: make test-reference
      - run: make test-module
      - run: make test-diff
      - if: always()
        run: docker compose logs

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ["chromium", "firefox", "webkit"]
    env:
      NGINX_VERSION: "1.30.4"
      BUILD_CC: gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: docker compose up -d --build backend envoy nginx
      - run: |
          set -euo pipefail
          for url in http://127.0.0.1:18081/ http://127.0.0.1:18080/; do
            ready=0
            for i in $(seq 1 45); do
              if curl -sS -o /dev/null "$url" 2>/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            test "$ready" -eq 1
          done
      - working-directory: tests/browser
        run: npm install
      - working-directory: tests/browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: make test-browser BROWSER=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ matrix.browser }}-failure
          path: tests/browser/test-results/
          if-no-files-found: error
          retention-days: 3
      - if: always()
        run: docker compose logs
