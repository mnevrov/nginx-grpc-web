name: rc-benchmark

on:
  pull_request:
    paths:
      - "perf/rc.py"
      - "perf/test_rc.py"
      - "perf/run-rc.sh"
      - ".github/workflows/rc-benchmark.yml"
      - "Makefile"
      - "docs/**"
      - "prompts/10_M15_CONTROLLED_RC.md"
  workflow_dispatch:

concurrency:
  group: rc-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: M15 RC evaluator failure-mode tests
        run: python3 perf/test_rc.py -q
      - name: Staircase CLI smoke
        run: |
          set -euo pipefail
          test "$(python3 perf/rc.py extend --steps 25,50,100 --max-streams 1000)" = "25,50,100,200"
