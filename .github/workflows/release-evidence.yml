name: release-evidence

on:
  pull_request:
    paths:
      - "release/**"
      - "scripts/package-module.sh"
      - "scripts/release-check.sh"
      - ".github/workflows/release-evidence.yml"
      - "Makefile"
      - "docs/RELEASE_EVIDENCE.md"
      - "docs/RELEASE_CHECKLIST.md"
  workflow_dispatch:

concurrency:
  group: release-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Release evidence unit/failure-mode tests
        run: make release-evidence-test

  bundle-mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Create exact-head harness-only evidence inputs
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          export SOURCE_SHA
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          sha = os.environ["SOURCE_SHA"]
          root = Path("/tmp/release-fixtures")
          controlled = root / "controlled"
          soak = root / "soak"
          controlled.mkdir(parents=True, exist_ok=True)
          soak.mkdir(parents=True, exist_ok=True)

          gates = {
              name: {"passed": True, "commit": sha, "evidence_class": "harness_only"}
              for name in ("compatibility", "protocol", "differential", "browser", "hardening")
          }
          (root / "gates.json").write_text(json.dumps(gates, indent=2) + "\n")
          (controlled / "manifest.json").write_text(json.dumps({
              "version": 1,
              "git_commit": sha,
              "nginx_version": "1.30.4",
              "build_cc": "gcc",
              "strict_preflight": False,
          }, indent=2) + "\n")
          (controlled / "decision.json").write_text(json.dumps({
              "version": 1,
              "host_fingerprint": "shared-ci-harness",
              "evidence_class": "harness_only",
              "recommendation": "inconclusive",
              "decision_reasons": ["harness_only"],
          }, indent=2) + "\n")
          (soak / "manifest.json").write_text(json.dumps({
              "version": 1,
              "git_commit": sha,
              "strict": False,
              "nginx_version": "1.30.4",
              "build_cc": "gcc",
              "target_duration_seconds": 8,
              "frontend": "tls-h2",
          }, indent=2) + "\n")
          (soak / "soak.json").write_text(json.dumps({
              "version": 1,
              "evidence_class": "harness_only",
              "verdict": "inconclusive",
              "mechanics_pass": True,
              "duration_seconds": 8,
              "events": {"host": {
                  "strict": False,
                  "valid": True,
                  "fingerprint": "shared-ci-harness",
              }},
          }, indent=2) + "\n")
          PY
      - name: Build package and validate release bundle mechanics
        env:
          RELEASE_GATES: /tmp/release-fixtures/gates.json
          RELEASE_CONTROLLED_DIR: /tmp/release-fixtures/controlled
          RELEASE_SOAK_DIR: /tmp/release-fixtures/soak
          RELEASE_OUTPUT_DIR: /tmp/release-bundle
          RELEASE_ALLOW_INCONCLUSIVE: "1"
          NGINX_VERSION: "1.30.4"
          BUILD_CC: gcc
        run: make release-check
      - name: Assert CI cannot become production evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/release-bundle/release-evidence.json").read_text())
          assert result["evidence_class"] == "harness_only", result
          assert result["verdict"] == "inconclusive", result
          assert result["mechanics_pass"] is True, result
          assert result["blockers"] == [], result
          assert result["gates"]["compatibility"]["passed"] is True, result
          assert "harness_only" in result["advisory"], result
          assert result["raw_revalidation"]["valid"] is None, result
          assert result["raw_revalidation"]["skipped"] == "harness_only", result
          revalidation = json.loads(Path("/tmp/release-bundle/revalidation.json").read_text())
          assert revalidation["skipped"] == "harness_only", revalidation
          package_dirs = list((Path("/tmp/release-bundle") / "artifacts").glob("nginx-1.30.4-gcc-linux-*"))
          assert len(package_dirs) == 1, package_dirs
          package = package_dirs[0]
          assert (package / "ngx_http_grpc_web_module.so").is_file(), package
          assert (package / "SHA256SUMS").is_file(), package
          assert (package / "MANIFEST.txt").is_file(), package
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-harness
          path: /tmp/release-bundle/
          if-no-files-found: warn
          retention-days: 3
