services:
  backend:
    build:
      context: ..
      dockerfile: tests/backend/Dockerfile

  fault-backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../tests/fault_backend/server.mjs:/app/server.mjs:ro
    command: ["node", "/app/server.mjs"]

  envoy:
    image: envoyproxy/envoy:v1.38.0
    depends_on:
      - backend
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro

  native-nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
      args:
        NGINX_VERSION: "${NGINX_VERSION:-1.30.4}"
        BUILD_CC: "${BUILD_CC:-gcc}"
    depends_on:
      - backend
      - fault-backend
    volumes:
      - ./nginx-native.conf:/etc/nginx/nginx.conf:ro
      - ./.certs:/etc/nginx/perf-tls:ro
    ports:
      - "19080:8080"
      - "19443:8443"
      - "19446:8446"

  legacy-nginx:
    image: "nginx:${NGINX_VERSION:-1.30.4}"
    depends_on:
      - envoy
    volumes:
      - ./nginx-legacy.conf:/etc/nginx/nginx.conf:ro
      - ./.certs:/etc/nginx/perf-tls:ro
    ports:
      - "19081:8080"
      - "19444:8443"
