worker_processes 1;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 32768;
}

http {
    access_log off;
    sendfile off;
    tcp_nodelay on;
    keepalive_timeout 75s;

    upstream grpc_web_envoy {
        server envoy:8081;
        keepalive 128;
    }

    # Preserve the M9 cleartext HTTP/1.1 baseline exactly: no HTTP/2 is
    # enabled on this listener.
    server {
        listen 8080;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass_request_headers on;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_pass http://grpc_web_envoy;
        }
    }

    # Production-like downstream transport. Kept separate from the HTTP/1.1
    # listener so the controlled M9 baseline remains unchanged.
    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate /etc/nginx/perf-tls/server.crt;
        ssl_certificate_key /etc/nginx/perf-tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:PerfTLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass_request_headers on;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_pass http://grpc_web_envoy;
        }
    }
}
