name: large-payload-server-streaming
protocol: grpc-web
primary_transport: grpc-web-text
rpc: grpcwebtest.TestService/Stream

request:
  message: perf-large-payload
  count: 8
  delay_ms: 100
  response_payload_bytes:
    - 1048576   # 1 MiB
    - 4194304   # 4 MiB
    - 8388608   # 8 MiB

concurrency:
  - 1
  - 4
  - 16

transport_matrix:
  - grpc-web-text
  - grpc-web-binary

measurement:
  warmup_seconds: 20
  duration_seconds: 60
  repetitions: 5
  order: randomized-ab

metrics:
  - ttfd_ms
  - data_interarrival_jitter_ms
  - stream_duration_ms
  - messages_per_second
  - payload_mib_per_second
  - wire_bytes_per_payload_byte
  - gateway_cpu_core_seconds_per_gib
  - gateway_rss_bytes
  - gateway_rss_bytes_per_active_stream
  - errors

compare:
  legacy: nginx-envoy
  native: nginx-grpc-web-module

notes:
  - Large response payload is generated by the backend; request remains small.
  - 4 MiB x 2 DATA frames is the normal CI correctness regression.
  - 8 MiB belongs to a controlled performance environment, not a noisy shared-runner benchmark gate.
  - Binary mode is diagnostic and isolates Base64 cost from proxy-hop cost.
