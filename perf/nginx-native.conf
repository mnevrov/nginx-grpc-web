load_module /etc/nginx/modules/ngx_http_grpc_web_module.so;

worker_processes 1;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 32768;
}

http {
    access_log off;
    sendfile off;
    tcp_nodelay on;
    keepalive_timeout 75s;

    upstream grpc_backend {
        server backend:50051;
    }

    server {
        listen 8080;
        listen 8443 ssl;
        http2 on;

        ssl_certificate /etc/nginx/perf-tls/server.crt;
        ssl_certificate_key /etc/nginx/perf-tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:PerfTLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        location / {
            grpc_web on;
            grpc_web_max_frame_size 64m;
            grpc_buffer_size 64k;
            grpc_connect_timeout 5s;
            grpc_read_timeout 1h;
            grpc_send_timeout 1h;
            grpc_pass grpc://grpc_backend;
        }
    }
}
